plugins {
    id 'java'
}

group = 'com.nexora'
version = '1.2.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // Only the API: the server provides it (and Gson) at runtime. Works on Paper, Spigot and Purpur 1.18 and newer.
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
}

processResources {
    filesMatching('plugin.yml') { expand(version: project.version) }
}

jar {
    archiveFileName = 'NexoraConnect.jar'
}
